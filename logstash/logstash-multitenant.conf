input {
    kafka {
        bootstrap_servers => "localhost:9092"
        topics => ["cpu_logs", "hpcm_logs"]
        codec => "json"
        group_id => "logstash-group"
    }
}

filter {
    # Ensure @timestamp is correctly parsed
    date {
        match => ["@timestamp", "ISO8601"]
        target => "@timestamp"
        remove_tag => ["_timestampparsefailure", "_dateparsefailure"]
    }

    # Convert @timestamp to nanoseconds (required by Loki)
    ruby {
        code => '
            t = event.get("@timestamp")
            if t
                event.set("loki_timestamp", (t.to_f * 1_000_000_000).to_i.to_s)
            end
        '
    }

    # Handle cpu_metrics
    if [log_type] == "cpu_metrics" {
        mutate {
            add_field => {
                "cpu_total"      => "%{[cpu_p]}"
                "user_percent"   => "%{[user_p]}"
                "system_percent" => "%{[system_p]}"
                "cpu0_usage"     => "%{[cpu0.p_cpu]}"
                "cpu1_usage"     => "%{[cpu1.p_cpu]}"
                "cpu2_usage"     => "%{[cpu2.p_cpu]}"
                "cpu3_usage"     => "%{[cpu3.p_cpu]}"
            }
        }
        mutate { add_field => { "source" => "cpu_logs" } }
    } else {
        # Handle system logs
        if ![message] or [message] == "" {
            mutate { add_field => { "message" => "No message available" } }
        }
        mutate { add_field => { "source" => "hpcm_logs" } }
    }
}

output {

    # Debugging output
    stdout { codec => rubydebug }

    # === Send to Loki ===

    # 1️⃣ Tenant: team1 → Send CPU total stats
    if [log_type] == "cpu_metrics" {
        http {
            url => "http://127.0.0.1:3100/loki/api/v1/push"
            http_method => "post"
            format => "message"
            content_type => "application/json"
            headers => {
                "Content-Type" => "application/json"
                "X-Scope-OrgID" => "cpuTotal"
            }
            message => '{
                "streams": [
                    {
                        "stream": {
                            "job": "logstash",
                            "source": "cpu_logs",
                            "log_type": "cpu_total"
                        },
                        "values": [
                            [ "%{[loki_timestamp]}", "Total: %{[cpu_total]}%, User: %{[user_percent]}%, System: %{[system_percent]}%" ]
                        ]
                    }
                ]
            }'
        }
    }

    # 2️⃣ Tenant: team2 → Send per-core CPU stats
    if [log_type] == "cpu_metrics" {
        http {
            url => "http://127.0.0.1:3100/loki/api/v1/push"
            http_method => "post"
            format => "message"
            content_type => "application/json"
            headers => {
                "Content-Type" => "application/json"
                "X-Scope-OrgID" => "cpuPerCore"
            }
            message => '{
                "streams": [
                    {
                        "stream": {
                            "job": "logstash",
                            "source": "cpu_logs",
                            "log_type": "per_core"
                        },
                        "values": [
                            [ "%{[loki_timestamp]}", "CPU0: %{[cpu0_usage]}%, CPU1: %{[cpu1_usage]}%, CPU2: %{[cpu2_usage]}%, CPU3: %{[cpu3_usage]}%" ]
                        ]
                    }
                ]
            }'
        }
    }

    # 3️⃣ Tenant: team3 → Send systemd logs
    if [log_type] == "system_logs" {
        http {
            url => "http://127.0.0.1:3100/loki/api/v1/push"
            http_method => "post"
            format => "message"
            content_type => "application/json"
            headers => {
                "Content-Type" => "application/json"
                "X-Scope-OrgID" => "system"
            }
            message => '{
                "streams": [
                    {
                        "stream": {
                            "job": "logstash",
                            "source": "hpcm_logs",
                            "log_type": "system_logs"
                        },
                        "values": [
                            [ "%{[loki_timestamp]}", "%{[message]}" ]
                        ]
                    }
                ]
            }'
        }
    }
}

