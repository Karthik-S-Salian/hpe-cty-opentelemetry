input {
  kafka {
    bootstrap_servers => "127.0.0.1:9092"
    topics => ["logs"]
    codec => "json"
    group_id => "logstash-group"
  }
}

filter {
  json {
    source => "log"
  }

  mutate {
    copy => { "log" => "loki_log" }
  }

  json {
    source => "loki_log"
    target => "loki_log"
  }

  ruby {
    code => '
      loki = event.get("loki_log")
      if loki.is_a?(Hash)

        # ---- Flatten Attributes ----
        attrs = loki.delete("Attributes")
        if attrs.is_a?(Hash)
          attrs.each do |k, v|
            safe_key = "attr_#{k}".gsub(".", "_")
            loki[safe_key] = v
          end
        end

        # ---- Flatten Resource ----
        res = loki.delete("Resource")
        if res.is_a?(Hash)
          res.each do |k, v|
            safe_key = "res_#{k}".gsub(".", "_")
            loki[safe_key] = v
          end
        end

        # ---- Convert Timestamp → nanoseconds ----
        ts = loki.delete("Timestamp")
        ts_ns = nil
        if ts
          begin
            year = Time.now.year
            parsed = Time.strptime("#{year} #{ts}", "%Y %b %d %H:%M:%S").utc
            ts_ns = (parsed.to_f * 1_000_000_000).to_i.to_s
            loki["timestamp_ns"] = ts_ns
          rescue => e
            logger.warn("Failed to parse loki_log Timestamp: #{ts}, error: #{e}")
          end
        end

        # ---- Build Loki payload ----
        if ts_ns
          payload = {
            "streams" => [
              {
                "stream" => {
                  "job" => loki["job"] || "logstash",
                  "log_type" => loki["attr_type"],
                  "process_id" => loki["res_process_id"],
                  "hostname" => loki["res_host_name"],
                  "servicename" => loki["res_service_name"],
                  "severity" => loki["severity"] || loki["Severity"]
                },
                "values" => [
                  [ ts_ns, JSON.generate(loki) ]
                ]
              }
            ]
          }
          event.set("loki_payload", payload)
        end

        # Save updated loki_log back
        # event.set("loki_log", loki)
      end
    '
  }



  
  ruby {
    code => '
      require "time"
      ts = event.get("@timestamp")
      if ts
        local_ts = ts.time.localtime("+05:30")
        event.set("timestamp", local_ts.iso8601)
      end
    '
  }

  mutate {
    remove_field => ["event","Timestamp","log","loki_log"]
  }

}

output {
  elasticsearch {
    hosts => ["http://localhost:9428/insert/elasticsearch/"]
    parameters => {
      "_msg_field"     => "Body"
      "_time_field"    => "timestamp"
      "_stream_fields" => "Resource.host.name,Resource.service.name,Attributes.type,Severity"
      "ignore_fields" => "loki_payload,loki_log"
    }
  }


  http {
    url => "http://localhost:3100/loki/api/v1/push"
    http_method => "post"
    format => "message"
    content_type => "application/json"
    message => "%{loki_payload}"
  }

  stdout { codec => rubydebug {metadata => true } }
}
