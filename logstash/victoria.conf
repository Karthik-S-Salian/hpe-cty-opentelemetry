input {
  kafka {
    bootstrap_servers => "127.0.0.1:9092"
    topics => ["logs"]
    codec => "json"
    group_id => "logstash-group"
  }
}

filter {
  json {
    source => "log"
  }
  
  ruby {
    code => '
      require "time"
      ts = event.get("@timestamp")
      if ts
        local_ts = ts.time.localtime("+05:30")
        event.set("timestamp", local_ts.iso8601)
      end
    '
  }

  mutate {
    remove_field => ["event","Timestamp","log"]
  }

}

output {
  elasticsearch {
    hosts => ["http://localhost:9428/insert/elasticsearch/"]
    parameters => {
      "_msg_field"     => "Body"
      "_time_field"    => "timestamp"
      "_stream_fields" => "Resource.host.name,Resource.service.name,Attributes.type,Severity"
    }
  }
  stdout { codec => rubydebug {metadata => true } }
}
